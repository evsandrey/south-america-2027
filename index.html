<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Южная Америка 2027 · 20.02 — 07.03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* ── Design tokens ─────────────────────────────── */
:root{
  --bg:#0a0e17; --bg2:#0d1322; --card:#121a2b; --card2:#16203a;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.28);
  --text:#e8eef8; --muted:#8d9bb3; --dim:#5f6c85;
  --acc:#6366f1; --acc2:#22d3ee; --grad:linear-gradient(120deg,#6366f1,#22d3ee);
  --ok:#34d399; --warn:#fbbf24; --r:12px; --r2:18px;
  --shadow:0 10px 30px -12px rgba(2,6,23,.8);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:#7dd3fc;text-decoration:none}
a:hover{text-decoration:underline}

/* ── Header ───────────────────────────────────── */
header{position:fixed;top:0;left:0;right:0;z-index:1200;padding:12px 20px;
  background:rgba(10,14,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff}
.brand h1{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:.72rem;color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{color:var(--text)}
.chip.hot{border-color:transparent;background:var(--grad);color:#fff}
nav.tabs{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px}
.tab{border:0;background:transparent;color:var(--muted);font:600 .82rem var(--font);
  padding:8px 16px;border-radius:999px;cursor:pointer;transition:.18s}
.tab.active{background:var(--grad);color:#fff}

/* ── Map tab ──────────────────────────────────── */
#mapTab{position:fixed;inset:64px 0 0;display:block}
#map{position:absolute;inset:0;background:#0b101c;z-index:1}
#panel{position:absolute;z-index:1000;right:16px;top:16px;width:330px;max-height:calc(100% - 90px);
  overflow:auto;background:rgba(18,26,43,.92);backdrop-filter:blur(10px);border:1px solid var(--line2);
  border-radius:var(--r2);box-shadow:var(--shadow);padding:16px;display:none}
#panel .tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:rgba(99,102,241,.16);color:#a5b4fc}
#panel h2{font-size:1.02rem;margin:8px 0 2px;letter-spacing:-.01em}
#panel .days{font-size:.76rem;color:var(--muted);margin-bottom:10px}
#panel ul{list-style:none}
#panel li{margin:8px 0;font-size:.85rem;line-height:1.45;display:flex;gap:8px}
#panel li::before{content:"◆";color:var(--acc2);font-size:.6rem;margin-top:5px}
#panel .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:1rem;border:0;background:none}
#legend{position:absolute;z-index:1000;left:16px;bottom:16px;background:rgba(18,26,43,.92);
  border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:.72rem;color:var(--muted)}
#legend .f{color:#f472b6}#legend .t{color:#22d3ee}#legend .g{color:#94a3b8}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--text);
  border-radius:10px;box-shadow:var(--shadow)}
.leaflet-popup-content{font-family:var(--font)}
.daymarker{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--grad);color:#fff;font:700 .68rem var(--font);box-shadow:0 0 0 3px rgba(99,102,241,.35)}
.daymarker.many{background:linear-gradient(120deg,#f472b6,#6366f1)}

/* ── Hourly tab ───────────────────────────────── */
#planTab{display:none;position:fixed;inset:64px 0 0;overflow:auto;padding:20px 16px 60px}
#planTab .wrap{max-width:860px;margin:0 auto}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
.daycard summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
  padding:14px 18px;user-select:none}
.daycard summary::-webkit-details-marker{display:none}
.daycard summary:hover{background:var(--card2)}
.daynum{min-width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  font-weight:800;color:#fff}
.dayhead h3{font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.dayhead .meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.daytotal{margin-left:auto;text-align:right}
.daytotal .t{font-weight:800;font-size:.95rem}
.daytotal .l{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.caret{color:var(--muted);transition:.2s}
details[open] .caret{transform:rotate(90deg)}
.tl{border-top:1px solid var(--line);padding:6px 18px 16px}
.trow{display:grid;grid-template-columns:96px 10px 1fr auto;gap:10px;align-items:start;padding:7px 0;position:relative}
.trow .t{font-size:.76rem;font-weight:700;color:#a5b4fc;text-align:right;padding-top:2px}
.trow .dot{width:9px;height:9px;border-radius:50%;background:var(--acc2);margin-top:6px;box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.trow .dot.flight{background:#f472b6;box-shadow:0 0 0 3px rgba(244,114,182,.15)}
.trow .dot.ground{background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}
.trow .c .w{font-size:.85rem;font-weight:600}
.trow .c .p{font-size:.72rem;color:var(--muted)}
.trow .c .n{font-size:.7rem;color:var(--dim);margin-top:3px;line-height:1.4}
.trow .c .n b{color:var(--warn);font-weight:600}
.usd{font-size:.72rem;font-weight:700;color:var(--ok);background:rgba(52,211,153,.12);
  padding:3px 8px;border-radius:999px;white-space:nowrap}
.ext{font-size:.7rem;color:#7dd3fc;border:1px solid rgba(125,211,252,.3);border-radius:999px;
  padding:3px 8px;white-space:nowrap}
.trow .costs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

@media (max-width:720px){
  header{padding:10px 12px;gap:8px}
  nav.tabs{width:100%;margin-left:0}
  .tab{flex:1;text-align:center;padding:9px 4px}
  .brand h1{font-size:.9rem}
  #mapTab{inset:118px 0 0}
  #planTab{inset:118px 0 0}
  #panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:54vh}
  #legend{left:8px;bottom:8px;padding:6px 9px;font-size:.66rem}
  .trow{grid-template-columns:70px 8px 1fr;gap:8px}
  .trow .costs{grid-column:3;justify-content:flex-start}
  .daycard summary{padding:11px 12px;gap:9px}
  .daynum{min-width:38px;height:38px}
}
</style>
</head>

/* ── Карта ── */
const byId = Object.fromEntries(DATA.places.map(p=>[p.id,p]));
const map = L.map('map').setView([-14,-52], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap', maxZoom:18}).addTo(map);

function showPlace(p){
  document.getElementById('p-tag').textContent = p.tag;
  document.getElementById('p-title').textContent = p.name;
  document.getElementById('p-days').textContent = p.days;
  document.getElementById('p-list').innerHTML = (p.sights.length ? p.sights : [["Только старт/финиш маршрута",""]]).map(s =>
    s[1] ? `<li><span><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></span></li>`
         : `<li><span style="color:var(--muted)">${s[0]}</span></li>`).join('');
  document.getElementById('panel').style.display = 'block';
}

DATA.places.forEach(p=>{
  const icon = L.divIcon({className:'', html:`<div class="daymarker ${p.days.split(',').length>2?'many':''}">${p.days.match(/\d+/)[0]}</div>`, iconSize:[24,24], iconAnchor:[12,12]});
  L.marker([p.lat,p.lng], {icon}).addTo(map).bindPopup(`<b>${p.name}</b><br><span style="color:#8d9bb3;font-size:.8em">${p.days}</span>`).on('click', ()=>showPlace(p));
});

const kindStyle = {flight:{c:'#f472b6',d:null,w:2.6}, train:{c:'#22d3ee',d:'6 8',w:2.6}, ground:{c:'#94a3b8',d:'4 7',w:2.2}};
DATA.legs.forEach(leg=>{
  const s = kindStyle[leg.kind];
  const l = L.polyline([[byId[leg.a].lat,byId[leg.a].lng],[byId[leg.b].lat,byId[leg.b].lng]],
    {color:s.c, weight:s.w, dashArray:s.d, opacity:.85}).addTo(map);
  l.bindTooltip(`<b>${leg.name}</b>`, {sticky:true});
  const link = leg.link ? `<br><a href="${leg.link}" target="_blank" rel="noopener">купить / проверить ↗</a>` : '';
  l.bindPopup(`<b>${leg.name}</b><br><span style="color:#8d9bb3;font-size:.82em">${leg.info}</span>${link}`);
});

/* ── Почасовой план ── */
const byDay = {};
DATA.hourly.forEach(r=>{ (byDay[r.day] = byDay[r.day] || []).push(r); });
const fmt = d => d.split('-').reverse().join('.');

document.getElementById('days').innerHTML = DATA.dayMeta.map(m=>{
  const rows = byDay[m.day] || [];
  const date = rows[0] ? fmt(rows[0].date) : '';
  const rowsHtml = rows.map(r=>{
    const kind = r.place.includes('перелёт')||/—\s?[A-Z]{3}/.test(r.place)||r.place.includes('LIM')||r.place.includes('IGU') ? 'flight'
      : (r.place.toLowerCase().includes('трансфер')||r.place.toLowerCase().includes('автобус')||r.place.includes('—')&&r.usd===0&&!r.link ? 'ground' : '');
    const usd = r.usd>0 ? `<span class="usd">$${r.usd}</span>` : '';
    const ext = r.link ? `<a class="ext" href="${r.link}" target="_blank" rel="noopener">↗</a>` : '';
    const note = r.note ? `<div class="n">${r.note.replace(/<[^>]+>/g,'')}</div>` : '';
    return `<div class="trow"><div class="t">${r.start}–${r.end}</div><div class="dot ${kind}"></div>
      <div class="c"><div class="w">${r.what}</div><div class="p">${r.place}</div>${note}</div>
      <div class="costs">${usd}${ext}</div></div>`;
  }).join('');
  return `<details class="daycard" ${m.day<=1?'open':''}>
    <summary><div class="daynum">${m.day}</div>
      <div class="dayhead"><h3>${m.title}</h3><div class="meta">${date} · ночёвка: ${m.night}</div></div>
      <div class="daytotal"><div class="t">$${m.total}</div><div class="l">итого</div></div>
      <span class="caret">▸</span></summary>
    <div class="tl">${rowsHtml}</div></details>`;
}).join('');

/* ── Вкладки ── */
function openTab(which, btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
  document.getElementById('mapTab').style.display = which==='map' ? 'block' : 'none';
  document.getElementById('planTab').style.display = which==='plan' ? 'block' : 'none';
  if(which==='map') setTimeout(()=>map.invalidateSize(), 60);
}
</script>
